name: Compilar PRX de diagnostico
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'Makefile'
      - 'exports.exp'
      - 'TTT_EXPANSION/plugin.ini'
      - '.github/workflows/compilar-prx.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: pspdev/pspdev:v20261001
    steps:
      - uses: actions/checkout@v5
      - name: Verificar SDK e compilar PRX
        shell: bash
        run: |
          set -euo pipefail
          export PSPDEV=/usr/local/pspdev
          export PATH="$PSPDEV/bin:$PATH"
          echo "PSPDEV=$PSPDEV"
          command -v psp-gcc
          psp-gcc --version | head -n 1
          echo "PSPSDK=$(psp-config --pspsdk-path)"
          echo "--- Arquivos de biblioteca relevantes ---"
          SDK_LIB="$(psp-config --pspsdk-path)/lib"
          for lib in libpspdisplay.a libpspctrl.a libpspuser.a libpspiofilemgr.a; do
            if test -f "$SDK_LIB/$lib"; then echo "OK: $lib"; else echo "NAO ENCONTRADA: $lib"; fi
          done
          echo "--- Inicio da compilacao ---"
          make --no-print-directory 2>&1 | tee build.log
          test -s ttt_expansion.prx
          mkdir -p dist/TTT_EXPANSION
          cp ttt_expansion.prx dist/TTT_EXPANSION/
          cp TTT_EXPANSION/plugin.ini dist/TTT_EXPANSION/
          cd dist
          zip -r ../TTT_EXPANSION_INSTALAR.zip TTT_EXPANSION
      - name: Disponibilizar log (inclusive em falhas)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TTT-Expansion-Build-Log-V031
          path: build.log
          if-no-files-found: warn
      - name: Disponibilizar plugin para instalar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TTT-Expansion-PRX-V031
          path: |
            ttt_expansion.prx
            TTT_EXPANSION_INSTALAR.zip
